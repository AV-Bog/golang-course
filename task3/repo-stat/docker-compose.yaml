services:
  api:
    build:
      context: ./repo-stat
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    volumes:
      - ./repo-stat/config.api.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  collector:
    build:
      context: ./repo-stat
      dockerfile: Dockerfile.collector
    ports:
      - "50051:50051"

  processor:
    build:
      context: ./repo-stat
      dockerfile: Dockerfile.processor
    ports:
      - "50052:50052"

  subscriber:
    build:
      context: ./repo-stat
      dockerfile: Dockerfile.subscriber
    ports:
      - "50053:50053"

  tests:
    build:
      context: ./tests
      dockerfile: Dockerfile
    depends_on:
      - api
      - collector
      - processor
      - subscriber
    environment:
      - API_URL=http://api:8080