services:
  collector:
    image: collector:latest
    build:
      context: repo-stat
      dockerfile: Dockerfile.collector
    container_name: collector
    restart: unless-stopped
    ports:
      - 50052:50052
    volumes:
      - ./repo-stat/collector/config/config.yaml:/config.yaml
    environment:
      - GRPC_ADDRESS=:50052
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}

  processor:
    image: processor:latest
    build:
      context: repo-stat
      dockerfile: Dockerfile.processor
    container_name: processor
    restart: unless-stopped
    ports:
      - 50051:50051
    volumes:
      - ./repo-stat/processor/config/config.yaml:/config.yaml
    environment:
      - GRPC_ADDRESS=:50051
      - COLLECTOR_ADDRESS=collector:50052
    depends_on:
      - collector

  api:
    image: api:latest
    build:
      context: repo-stat
      dockerfile: Dockerfile.api
    container_name: api
    restart: unless-stopped
    ports:
      - 28080:8080
    volumes:
      - ./repo-stat/api/config/config.yaml:/config.yaml
    environment:
      - LISTEN_ADDRESS=:8080
      - PROCESSOR_ADDRESS=processor:50051
      - SUBSCRIBER_ADDRESS=subscriber:8080
    depends_on:
      - processor
      - subscriber

  subscriber:
    image: subscriber:latest
    build:
      context: repo-stat
      dockerfile: Dockerfile.subscriber
    container_name: subscriber
    restart: unless-stopped
    ports:
      - 28081:8080
    volumes:
      - ./repo-stat/subscriber/config/config.yaml:/config.yaml
    environment:
      - LISTEN_ADDRESS=:8080

  tests:
    image: tests:latest
    build:
      context: tests
    container_name: tests
    restart: "no"
    depends_on:
      - api
      - processor
      - collector
    entrypoint: ["true"]