services:
  api:
    platform: linux/arm64
    build:
      context: ./repo-stat
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    volumes:
      - ./repo-stat/config.api.yaml:/app/config.yaml:ro

  collector:
    platform: linux/arm64
    build:
      context: ./repo-stat
      dockerfile: Dockerfile.collector
    ports:
      - "50051:50051"
    volumes:
      - ./repo-stat/config.yaml:/app/config.yaml:ro

  processor:
    platform: linux/arm64
    build:
      context: ./repo-stat
      dockerfile: Dockerfile.processor
    ports:
      - "50052:50052"
    volumes:
      - ./repo-stat/config.processor.yaml:/app/config.yaml:ro

  subscriber:
    platform: linux/arm64
    build:
      context: ./repo-stat
      dockerfile: Dockerfile.subscriber
    ports:
      - "50053:50053"
    volumes:
      - ./repo-stat/config.subscriber.yaml:/app/config.yaml:ro

  tests:
    platform: linux/arm64
    build:
      context: ./tests
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      - API_URL=http://api:8080
