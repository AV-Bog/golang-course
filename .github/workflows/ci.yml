name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Start Docker services
        run: |
          cd task3
          docker compose up -d --build
          sleep 30
          docker compose ps
          curl http://localhost:28080/health || echo "Health check failed"

      - name: Run tests
        run: |
          cd task3/tests
          go test -v ./

      - name: Stop containers
        if: always()
        run: |
          cd task3
          docker compose down
