name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task3
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: task3/repo-stat/go.mod
          cache: true
          cache-dependency-path: task3/repo-stat/go.sum

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protoc-34.1-linux-x86_64.zip
          sudo unzip -o protoc-34.1-linux-x86_64.zip -d /usr/local
          sudo chmod +x /usr/local/bin/protoc
          protoc --version

      - name: Install tools
        run: make -C repo-stat tools

      - name: Generate protobuf
        run: make -C repo-stat protobuf

      - name: Check protobuf generation
        run: |
          git diff --exit-code

      - name: Lint
        run: make -C repo-stat lint

      - name: Build
        run: make -C repo-stat build

      - name: Unit tests
        run: make -C repo-stat test

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    defaults:
      run:
        working-directory: task3
    steps:
      - uses: actions/checkout@v5

      - name: Start services with Docker
        run: |
          cd repo-stat
          docker compose up -d --build
          echo "Waiting for services to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:28080/health | grep -q "ok"; then
              echo "API is ready!"
              break
            fi
            echo "Waiting... (attempt $i/30)"
            sleep 2
          done
          curl -v http://localhost:28080/api/ping

      - name: Run integration tests
        run: |
          cd tests
          go test -v ./

      - name: Stop containers
        if: always()
        run: |
          cd repo-stat
          docker compose down