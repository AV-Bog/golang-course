name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build-Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Start Docker containers
        run: |
          cd task3
          docker compose up -d --build
          sleep 15

      - name: Run tests
        run: |
          cd task3/tests
          go test -v ./

      - name: Stop Docker containers
        if: always()
        run: |
          cd task3
          docker compose down