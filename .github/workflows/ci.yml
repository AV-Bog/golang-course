name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build-Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Start containers
        run: |
          cd task3
          docker compose up -d --build
          
          echo "=== Waiting 30 seconds ==="
          sleep 30
          
          echo "=== Container Status ==="
          docker compose ps
          
          echo "=== All container logs ==="
          docker compose logs --tail=100
          
          echo "=== Check API health ==="
          curl -v http://localhost:8080/health || echo "HEALTH ENDPOINT FAILED"
          
          echo "=== Check API ping ==="
          curl -v http://localhost:8080/api/ping || echo "PING ENDPOINT FAILED"
          
          echo "=== Check if API is listening inside container ==="
          docker exec task3-api-1 netstat -tlnp 2>/dev/null || docker exec task3-api-1 ss -tlnp 2>/dev/null || echo "Cannot check netstat"
          
          echo "=== Check API process ==="
          docker exec task3-api-1 ps aux || echo "Cannot check process"

      - name: Run tests
        run: |
          cd task3/tests
          go test -v ./

      - name: Stop containers
        if: always()
        run: |
          cd task3
          docker compose down