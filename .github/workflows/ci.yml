name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build-Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Start containers
        run: |
          cd task3
          docker compose up -d --build

          echo "Waiting for API to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:8080/health 2>/dev/null | grep -q "ok"; then
              echo "API is ready after $i seconds"
              break
            fi
            echo "Waiting for API... ($i/60)"
            sleep 2
          done

          echo "=== Container Status ==="
          docker compose ps

      - name: Run tests
        run: |
          cd task3/tests
          go test -v ./

      - name: Stop containers
        if: always()
        run: |
          cd task3
          docker compose down