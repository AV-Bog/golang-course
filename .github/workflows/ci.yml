name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task3/repo-stat
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install lint tools
        run: make tools

      - name: Build
        run: go build ./...

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Build and run with docker compose
        run: |
          cd task3
          docker compose up -d --build
          
          echo "Waiting for containers to start..."
          sleep 10
          
          docker compose ps
          
          echo "Waiting for API to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/health; then
              echo "API is ready after $i seconds"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          
          docker compose logs --tail=50

      - name: Run integration tests
        run: |
          cd task3/tests
          go test -v ./
        env:
          CONTAINER_RUNTIME: docker

      - name: Stop containers
        if: always()
        run: |
          cd task3
          docker compose down

      - name: Show logs on failure
        if: failure()
        run: |
          cd task3
          echo "=== Full logs on failure ==="
          docker compose logs