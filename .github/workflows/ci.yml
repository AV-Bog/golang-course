name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Build services
        run: |
          cd task3/repo-stat
          go build -o /tmp/api ./api/cmd/app
          go build -o /tmp/collector ./collector/cmd/app
          go build -o /tmp/processor ./processor/cmd/app
          go build -o /tmp/subscriber ./subscriber/cmd/app

      - name: Copy configs
        run: |
          cp task3/repo-stat/config.yaml /tmp/config.yaml
          cp task3/repo-stat/config.processor.yaml /tmp/config.processor.yaml
          cp task3/repo-stat/config.subscriber.yaml /tmp/config.subscriber.yaml
          cp task3/repo-stat/config.api.yaml /tmp/config.api.yaml

      - name: Run services
        run: |
          /tmp/collector -config /tmp/config.yaml &
          sleep 2
          /tmp/processor -config /tmp/config.processor.yaml &
          sleep 2
          /tmp/subscriber -config /tmp/config.subscriber.yaml &
          sleep 2
          /tmp/api -config /tmp/config.api.yaml &
          
          sleep 15
          
          curl -v http://localhost:8080/health
          curl -v http://localhost:8080/api/ping

      - name: Run tests
        run: |
          cd task3/tests
          go test -v ./