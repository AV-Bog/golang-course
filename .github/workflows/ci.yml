name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task3/repo-stat
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Generate protobuf
        run: make protobuf

      - name: Build
        run: go build ./...

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build and run with docker-compose
        run: |
          cd task3
          docker-compose up -d --build
          sleep 15
          docker-compose ps
          docker-compose logs

      - name: Run integration tests
        run: |
          cd task3/repo-stat
          go test -v ./...
        env:
          CONTAINER_RUNTIME: docker

      - name: Stop containers
        if: always()
        run: |
          cd task3
          docker-compose down