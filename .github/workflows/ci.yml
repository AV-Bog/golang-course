name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build-Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Build and run containers
        run: |
          cd task3
          docker compose up -d --build
          
          echo "=== Waiting 30 seconds ==="
          sleep 30
          
          echo "=== Docker Compose Status ==="
          docker compose ps
          
          echo "=== API Logs ==="
          docker compose logs api
          
          echo "=== Collector Logs ==="
          docker compose logs collector
          
          echo "=== Processor Logs ==="
          docker compose logs processor
          
          echo "=== Subscriber Logs ==="
          docker compose logs subscriber
          
          echo "=== Testing API from host ==="
          curl -v http://localhost:8080/health || echo "HEALTH ENDPOINT FAILED"
          curl -v http://localhost:8080/api/ping || echo "PING ENDPOINT FAILED"
          
          echo "=== Testing API from inside container ==="
          docker exec task3-api-1 wget -O- http://localhost:8080/health 2>&1 || echo "Cannot connect from inside"

      - name: Run tests
        run: |
          cd task3/tests
          go test -v ./

      - name: Stop containers
        if: always()
        run: |
          cd task3
          docker compose down